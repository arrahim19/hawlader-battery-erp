services:
  - type: web
    name: hawlader-battery-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace @hawlader/api
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: https://hawlader-battery-erp.ar-rahim-41b.workers.dev
      - key: CSRF_SECRET
        generateValue: true
      - key: API_PROXY_SECRET
        sync: false
